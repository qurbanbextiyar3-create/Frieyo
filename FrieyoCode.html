<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Fireyo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Unbounded:wght@700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b1020;
      --rail: #0b1120;
      --panel: #121b34;
      --panel-2: #1a2647;
      --line: rgba(150,170,255,0.18);
      --card: rgba(255,255,255,0.02);
      --text: #edf3ff;
      --muted: #95a2d6;
      --accent: #5f78e0;
      --accent-soft: rgba(95,120,224,0.18);
      --success: #4dd3a1;
      --warn: #f3bc5a;
      --danger: #ef5b7a;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Figtree", sans-serif;
      overflow: hidden;
    }
    button, input {
      font: inherit;
    }

    #app {
      display: grid;
      grid-template-columns: 72px 240px minmax(0, 1fr) 220px;
      height: 100vh;
      background: linear-gradient(180deg, #090d18 0%, #10182d 100%);
    }

    .rail {
      background: var(--rail);
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 0;
      gap: 10px;
    }

    .srv {
      width: 44px;
      height: 44px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      background: var(--panel-2);
      border: 1px solid transparent;
      color: var(--text);
      font-weight: 800;
      cursor: pointer;
      transition: 0.18s ease;
    }

    .srv:hover {
      background: var(--accent);
      transform: translateY(-1px);
    }

    .srv.on {
      background: var(--accent);
      border-color: rgba(255,255,255,0.1);
      border-radius: 14px;
    }

    .sidebar {
      background: rgba(18,27,52,0.92);
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .brand {
      height: 52px;
      display: flex;
      align-items: center;
      padding: 0 16px;
      font-weight: 800;
      font-size: 16px;
      border-bottom: 1px solid var(--line);
      letter-spacing: 0.02em;
    }

    .room-list {
      padding: 12px 10px;
      overflow: auto;
      flex: 1;
    }

    .room {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 10px;
      border-radius: 10px;
      color: var(--muted);
      font-weight: 600;
      cursor: pointer;
      transition: 0.15s ease;
    }

    .room:hover {
      background: rgba(255,255,255,0.03);
      color: var(--text);
    }

    .room.active {
      background: rgba(95,120,224,0.14);
      color: var(--text);
    }

    .room .hash {
      opacity: 0.8;
      font-weight: 700;
    }

    .userbar {
      height: 58px;
      border-top: 1px solid var(--line);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background: rgba(12,18,31,0.95);
    }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 12px;
      font-weight: 800;
      color: #fff;
      flex-shrink: 0;
      position: relative;
      overflow: hidden;
    }

    .avatar::after {
      content: "";
      position: absolute;
      right: -2px;
      bottom: -2px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--success);
      border: 2px solid #0f172b;
    }

    .user-meta {
      min-width: 0;
      flex: 1;
    }

    .user-meta strong,
    .user-meta small {
      display: block;
      max-width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .user-meta strong { font-size: 13px; }
    .user-meta small { color: var(--muted); font-size: 11px; }

    .icon-btn {
      width: 30px;
      height: 30px;
      background: transparent;
      border: 1px solid transparent;
      color: var(--muted);
      border-radius: 8px;
      display: grid;
      place-items: center;
      cursor: pointer;
    }

    .icon-btn:hover {
      background: rgba(255,255,255,0.04);
      color: var(--text);
    }

    .main {
      display: flex;
      flex-direction: column;
      min-width: 0;
      background: rgba(18,27,52,0.64);
    }

    .topbar {
      height: 52px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 16px;
      border-bottom: 1px solid var(--line);
      background: rgba(11,17,32,0.45);
      flex-shrink: 0;
    }

    .topbar .title {
      font-size: 16px;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .topbar .title span {
      color: var(--muted);
      font-weight: 600;
      margin-left: 8px;
    }

    .spacer { flex: 1; }

    .messages {
      flex: 1;
      overflow: auto;
      padding: 18px 14px 8px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: radial-gradient(circle at top, rgba(95,120,224,0.08), transparent 40%);
    }

    .msg {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      padding: 4px 4px;
      border-radius: 12px;
    }

    .msg:hover {
      background: rgba(255,255,255,0.02);
    }

    .msg .avatar {
      width: 36px;
      height: 36px;
      font-size: 12px;
    }

    .msg-body {
      min-width: 0;
      flex: 1;
    }

    .msg-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }

    .msg-meta strong {
      font-size: 15px;
      font-weight: 700;
    }

    .msg-meta time {
      color: var(--muted);
      font-size: 11px;
    }

    .msg-body p {
      margin: 0;
      line-height: 1.55;
      color: var(--text);
      word-break: break-word;
      max-width: 72ch;
    }

    .composer {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 16px 16px;
      padding: 4px 8px 4px 12px;
      border: 1px solid var(--line);
      background: rgba(22,31,55,0.9);
      border-radius: 12px;
      min-height: 52px;
      flex-shrink: 0;
    }

    .composer input {
      flex: 1;
      min-width: 0;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 15px;
      padding: 12px 0;
    }

    .composer input::placeholder {
      color: var(--muted);
    }

    .send {
      border: none;
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      border-radius: 10px;
      padding: 10px 16px;
      cursor: pointer;
      transition: 0.15s ease;
    }

    .send:hover {
      filter: brightness(1.08);
    }

    .members {
      background: rgba(18,27,52,0.92);
      border-left: 1px solid var(--line);
      padding: 12px 10px;
      overflow-y: auto;
    }

    .members h4 {
      margin: 0 0 10px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 11px;
      padding: 0 8px;
    }

    .member {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 8px;
      border-radius: 10px;
      color: var(--text);
      cursor: pointer;
    }

    .member:hover {
      background: rgba(255,255,255,0.03);
    }

    .member .avatar {
      width: 28px;
      height: 28px;
      font-size: 11px;
    }

    .member .avatar::after {
      width: 9px;
      height: 9px;
      border-width: 2px;
      right: -1px;
      bottom: -1px;
    }

    .member small {
      display: block;
      color: var(--muted);
      font-size: 11px;
      margin-top: 2px;
    }

    .member .meta {
      min-width: 0;
      flex: 1;
    }

    .member .meta strong,
    .member .meta small {
      display: block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    @media (max-width: 960px) {
      #app {
        grid-template-columns: 64px 1fr;
      }
      .members {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <nav class="rail" aria-label="Sunucular">
      <div class="srv on">F</div>
      <div class="srv">A</div>
      <div class="srv">M</div>
      <div class="srv">+</div>
    </nav>

    <aside class="sidebar">
      <div class="brand">Fireyo</div>
      <div class="room-list">
        <div class="room active"><span class="hash">#</span> genel</div>
        <div class="room"><span class="hash">#</span> duyurular</div>
        <div class="room"><span class="hash">#</span> toplantı</div>
        <div class="room"><span class="hash">#</span> oyun</div>
      </div>

      <div class="userbar">
        <div class="avatar" style="background:#5f78e0;">S</div>
        <div class="user-meta">
          <strong>Sen</strong>
          <small>Çevrimiçi</small>
        </div>
        <button class="icon-btn" aria-label="Mikrofon">◉</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="title"># genel <span>Frieyo mockup</span></div>
        <div class="spacer"></div>
        <button class="icon-btn" aria-label="Favoriler">★</button>
        <button class="icon-btn" aria-label="Bildirimler">🔔</button>
      </header>

      <div class="messages" id="messages" aria-live="polite"></div>

      <div class="composer">
        <button class="icon-btn" aria-label="Ek ekle">＋</button>
        <input id="chatInput" type="text" placeholder="Mesaj yaz..." />
        <button class="send" id="sendBtn">Gönder</button>
      </div>
    </main>

    <aside class="members">
      <h4>Üyeler</h4>
      <div id="membersList"></div>
    </aside>
  </div>

  <script>
    const state = {
      members: [
        { name: "Aylin", status: "online", color: "#5f78e0" },
        { name: "Baran", status: "idle", color: "#3fd0a0" },
        { name: "Luna", status: "online", color: "#d86fe8" },
        { name: "Deniz", status: "dnd", color: "#ef5b7a" },
        { name: "Mert", status: "online", color: "#f3bc5a" },
        { name: "Sen", status: "online", color: "#7fa1ff" }
      ],
      messages: [
        { user: "Aylin", time: "09:12", text: "Merhaba! Frieyo odası için ilk mockup hazır görünüyor." },
        { user: "Baran", time: "09:14", text: "3D oda hissi çok iyi. Duygusal ve premium duruyor." },
        { user: "Luna", time: "09:15", text: "Şimdi sadece arayüzü sadeleştirip oda akışını netleştirelim." },
        { user: "Sen", time: "09:16", text: "Evet. Sunucu ve kullanıcı sistemlerini kaldırıp sadece mockup odaklı bir tasarım kalacak." }
      ]
    };

    function avatarHtml(name, color) {
      const letter = name.charAt(0).toUpperCase();
      return `<div class="avatar" style="background:${color};">${letter}</div>`;
    }

    function renderMembers() {
      const list = document.getElementById('membersList');
      list.innerHTML = state.members.map(member => {
        const status = member.status === 'online' ? 'Çevrimiçi' :
          member.status === 'idle' ? 'Boşta' :
          member.status === 'dnd' ? 'Rahatsız etmeyin' : 'Çevrimdışı';

        return `
          <div class="member">
            ${avatarHtml(member.name, member.color)}
            <div class="meta">
              <strong>${member.name}</strong>
              <small>${status}</small>
            </div>
          </div>
        `;
      }).join('');
    }

    function renderMessages() {
      const messages = document.getElementById('messages');
      messages.innerHTML = state.messages.map(msg => `
        <div class="msg">
          ${avatarHtml(msg.user, state.members.find(m => m.name === msg.user)?.color || '#5f78e0')}
          <div class="msg-body">
            <div class="msg-meta">
              <strong>${msg.user}</strong>
              <time>${msg.time}</time>
            </div>
            <p>${msg.text}</p>
          </div>
        </div>
      `).join('');
    }

    function addMessage() {
      const input = document.getElementById('chatInput');
      const value = input.value.trim();
      if (!value) return;

      state.messages.push({
        user: 'Sen',
        time: new Date().toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit', hour12: false }),
        text: value
      });

      input.value = '';
      renderMessages();
      messages.scrollTop = messages.scrollHeight;
    }

    document.getElementById('sendBtn').addEventListener('click', addMessage);
    document.getElementById('chatInput').addEventListener('keydown', (event) => {
      if (event.key === 'Enter') addMessage();
    });

    renderMembers();
    renderMessages();
    const messages = document.getElementById('messages');
    messages.scrollTop = messages.scrollHeight;
  </script>
</body>
</html>
